replicaCount: 2

image:
  repository: ghcr.io/kakaotech-19/kakaotech-19/backend
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "250m"
    memory: "1000Mi"
  requests:
    cpu: "125m"
    memory: "500Mi"

nodeSelector: {}
tolerations: []
affinity: {}

updateStrategy:
  rollingUpdate:
    maxUnavailable: 1 # 업데이트 중 비활성화 가능한 최대 Pod 수 (절대값 또는 퍼센트)
    maxSurge: 1        # 업데이트 중 생성 가능한 추가 Pod 수 (절대값 또는 퍼센트)

# Pod Scaling
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  cpu:
    targetUtilizationPercentage: 70
  memory:
    targetUtilizationPercentage: 70
